name: evolve
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engines/evolve/**"]
concurrency:
  group: evolve
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engines/evolve/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: engines/evolve
      - name: Evolve researcher (walk-forward оптимизация + golden-паттерны)
        working-directory: engines/evolve
        run: |
          rm -f evolve_log.txt
          timeout 900 python researcher.py > evolve_log.txt 2>&1 || echo "EVOLVE FAILED (exit $?)" >> evolve_log.txt
          tail -30 evolve_log.txt
          exit 0
      - name: Копируем лучшие параметры для okx-трейдера
        run: cp engines/okx/best_params.json engines/okx/best_params.json 2>/dev/null || true
      - name: Unified reporter
        run: python reporter.py || true
      - name: Commit (устойчиво к гонкам)
        if: always()
        run: |
          sleep 20
          git config user.name "omni-bot"
          git config user.email "omni-bot@users.noreply.github.com"
          git add results/evolve.json engines/okx/best_params.json engines/evolve/evolve_log.txt results/universe.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: evolve wave [skip ci]" || true
            for i in 1 2 3 4 5 6; do
              git fetch origin || true
              git rebase origin/main > /dev/null 2>&1 || { git rebase --abort > /dev/null 2>&1 || true; sleep 10; continue; }
              git push origin HEAD:main && exit 0
              sleep 10
            done
          fi
          exit 0
