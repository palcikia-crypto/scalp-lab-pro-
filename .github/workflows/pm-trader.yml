name: pm-trader
on:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engines/pm/**"]
concurrency:
  group: pm-trader
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (лог в файл)
        run: |
          pip install py-clob-client requests 2>&1 | tee pm_pip_log.txt | tail -3
      - name: Polymarket CLOB trader (live при Secrets, иначе тихо skip)
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_ADDRESS: ${{ secrets.POLY_ADDRESS }}
          POLY_ORDER_USDC: ${{ secrets.POLY_ORDER_USDC }}
          POLY_MIN_EDGE: ${{ secrets.POLY_MIN_EDGE }}
        run: |
          rm -f pm_clob_log.txt
          timeout 300 python engines/pm/clob_trader.py > pm_clob_log.txt 2>&1 || echo "CLOB FAILED (exit $?)" >> pm_clob_log.txt
          cat pm_clob_log.txt | tail -30
          exit 0
      - name: Unified reporter
        run: python reporter.py || true
      - name: Commit (устойчиво к гонкам)
        if: always()
        run: |
          sleep 20
          git config user.name "omni-bot"
          git config user.email "omni-bot@users.noreply.github.com"
          git add results/clob.json pm_clob_log.txt pm_pip_log.txt results/universe.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: pm clob trader [skip ci]" || true
            for i in 1 2 3 4 5 6; do
              git fetch origin || true
              git rebase origin/main > /dev/null 2>&1 || { git rebase --abort > /dev/null 2>&1 || true; sleep 10; continue; }
              git push origin HEAD:main && exit 0
              sleep 10
            done
          fi
          exit 0
