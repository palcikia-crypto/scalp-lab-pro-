<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniLab — автономная торговая экосистема</title>
<style>
:root{
  --bg:#05070f;--tx:#eef2fb;--mut:#8b93ad;--dim:#5b6478;
  --acc:#5eead4;--acc2:#818cf8;--acc3:#f472b6;--gold:#fbbf24;
  --ok:#34d399;--warn:#fbbf24;--bad:#fb7185;
  --glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.03);
  --bd:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--tx);
  font-family:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.55;min-height:100vh;padding:24px 20px 60px;
  letter-spacing:.01em;
}
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.mesh::before,.mesh::after{content:'';position:absolute;border-radius:50%;filter:blur(110px);opacity:.35}
.mesh::before{width:52vw;height:52vw;background:radial-gradient(circle,#134e4a,transparent 70%);top:-18vw;left:-14vw}
.mesh::after{width:46vw;height:46vw;background:radial-gradient(circle,#312e81,transparent 70%);bottom:-16vw;right:-12vw}
.wrap{max-width:1280px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:14px;background:conic-gradient(from 210deg,#5eead4,#818cf8,#f472b6,#5eead4);
  display:grid;place-items:center;font-size:22px;box-shadow:0 0 34px rgba(94,234,212,.35)}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#5eead4,#818cf8 55%,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mut);font-size:12px;margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;
  background:var(--glass);bord
er:1px solid var(--bd);backdrop-filter:blur(14px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
.dot.w{background:var(--warn);box-shadow:0 0 0 0 rgba(251,191,36,.5)}
.dot.b{background:var(--bad);box-shadow:0 0 0 0 rgba(251,113,133,.5)}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tabs{display:flex;gap:6px;padding:6px;border-radius:16px;background:var(--glass2);border:1px solid var(--bd);
  backdrop-filter:blur(18px);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;
  padding:9px 18px;border-radius:11px;cursor:pointer;transition:.25s;white-space:nowrap}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:#04111a;background:linear-gradient(135deg,#5eead4,#7dd3fc);box-shadow:0 4px 20px rgba(94,234,212,.28)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.kpi{background:var(--glass);border:1px solid var(--bd);border-radius:18px;padding:16px 18px;
  backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:.25s}
.kpi:hover{transform:translateY(-3px);border-color:rgba(94,234,212,.35)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(94,234,212,.7),transparent);opacity:0;transition:.3s}
.kpi:hover::before{opacity:1}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.grad{background:linear-gradient(90deg,#5eead4,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.pos{color:var(--ok)}.neg{color:var(--bad)}.gold{color:var(--gold)}
.panel
{background:var(--glass2);border:1px solid var(--bd);border-radius:20px;padding:18px 20px;margin-top:16px;
  backdrop-filter:blur(20px)}
.panel h3{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#b9c2d6;
  display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel h3 .ic{font-size:15px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  padding:7px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
tr:hover td{background:rgba(94,234,212,.045)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.b-ok{background:rgba(52,211,153,.13);color:var(--ok)}
.b-warn{background:rgba(251,191,36,.13);color:var(--warn)}
.b-bad{background:rgba(251,113,133,.13);color:var(--bad)}
.b-live{background:linear-gradient(90deg,rgba(52,211,153,.18),rgba(94,234,212,.14));color:var(--acc)}
.b-acc{background:rgba(129,140,248,.15);color:#a5b4fc}
.b-gold{background:rgba(251,191,36,.14);color:var(--gold)}
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.mod{background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;transition:.25s}
.mod:hover{transform:translateY(-2px);border-color:rgba(129,140,248,.4)}
.mod .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mod .nm{font-weight:700;font-size:13px}
.mod .ds{color:var(--mut);font-size:11.5px}
.mod .mt{color:var(--dim);font-size:11px;margin-top:4px}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.spark{width:100%;height:44px;margin-top:6px}
.empty{color:var(--dim);font-size:12.5px;padding:8px 2px}
.gbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.gcard{background:rgba(251,191,36,
.06);border:1px solid rgba(251,191,36,.22);border-radius:14px;padding:11px 14px;min-width:230px}
.gcard .s{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:700}
.gcard .n{font-size:13px;font-weight:700;margin-top:2px}
.gcard .d{color:var(--mut);font-size:11.5px;margin-top:1px}
footer{margin-top:26px;text-align:center;color:var(--dim);font-size:11px}
@media(max-width:640px){body{padding:14px 10px 40px}.kpi .v{font-size:21px}.tabs button{padding:8px 12px}}
</style>
</head>
<body>
<div class="mesh"></div>
<div class="wrap">
<header>
  <div class="brand">
    <div class="logo"></div>
    <div>
      <h1>Omni<span>Lab</span></h1>
      <div class="tag">Автономная торговая экосистема  OKX + Polymarket + бэктесты + эволюция  GitHub Actions 24/7</div>
    </div>
  </div>
  <div id="hdr"></div>
</header>

<div class="tabs" id="tabs">
  <button data-t="ov" class="on"> Обзор</button>
  <button data-t="live"> Live-торговля</button>
  <button data-t="pm"> Polymarket</button>
  <button data-t="bt"> Бэктесты</button>
  <button data-t="ev"> Эволюция</button>
  <button data-t="rs"> Исследования</button>
</div>
<div id="app"><div class="mut" style="padding:40px;text-align:center">Инициализация экосистемы…</div></div>
<footer>OmniLab  саморазвивающаяся система: эволюция параметров каждый час  walk-forward без подгонки  обновление данных каждые 60 секунд</footer>
</div>
<script>
var RAW='https://raw.githubusercontent.com/palcikia-crypto/scalp-lab-pro-/main/';
var T={};
function get(p){return fetch(RAW+p+'?t='+Date.now()).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
function esc(s){return String(s==null?'—':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pct(v){v=parseFloat(v);return isNaN(v)?'—':(v>=0?'+':'')+v.toFixed(2)+'%'}
function cls(v){v=parseFloat(v);return isNaN(v)?'':v>=0?'pos':'neg'}
function dt(iso){return iso?String(iso).re
place('T',' ').slice(0,19)+' UTC':'—'}
function ago(s){if(s==null)return '—';s=Math.round(s/60);if(s<1)return 'только что';if(s<60)return s+' мин назад';s=Math.round(s/60);if(s<48)return s+' ч назад';return Math.round(s/24)+' дн назад'}
function hbadge(h){return '<span class="badge '+(h==='ok'?'b-ok':(h==='warmup'?'b-warn':'b-bad'))+'">'+(h==='ok'?'OK':(h==='warmup'?'WARMUP':'STALE'))+'</span>'}
function kpi(k,v,s,c){return '<div class="kpi"><div class="k">'+k+'</div><div class="v '+(c||'')+'">'+v+'</div><div class="s">'+s+'</div></div>'}
function table(head,rows){if(!rows.length)return '<div class="empty">Нет данных — модуль ещ собирает статистику</div>';
return '<table><tr>'+head.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+
rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+x+'</td>'}).join('')+'</tr>'}).join('')+'</table>'}
function sparkline(pnls){
  if(!pnls||pnls.length<2)return '';
  var pts=[],acc=0,vals=pnls.map(function(p){acc+=parseFloat(p)||0;return acc});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  for(var i=0;i<vals.length;i++){pts.push((i/(vals.length-1)*300).toFixed(1)+','+(40-((vals[i]-mn)/rg*36)).toFixed(1))}
  var up=acc>=0;
  return '<svg class="spark" viewBox="0 0 300 44" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">'+
  '<stop offset="0" stop-color="'+(up?'#5eead4':'#fb7185')+'"/><stop offset="1" stop-color="'+(up?'#818cf8':'#f472b6')+'"/></linearGradient></defs>'+
  '<polyline fill="none" stroke="url(#sg)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="'+pts.join(' ')+'"/></svg>';
}
function header(U){
  var H=(U.health&&U.health.modules)||{};
  var ok=0,tot=0;for(var k in H){tot++;if(H[k]==='ok')ok++}
  var all=H.pm_worker==='ok'&&H.pm_lab==='ok';
  var cls=all?'':' w';
  document.getElementById('hdr').innerHTML='<div class="pill"><span class="dot'+cls+'"></span>Система: '+(U.health&&U.health.overall==='ok'?'
Все модули активны':ok+' / '+tot+' модулей активны')+'</div><div class="pill" style="margin-top:6px"> '+new Date().toLocaleTimeString()+'</div>';
}
function render(){
  var tab=document.querySelector('#tabs button.on').dataset.t;
  var U=T.uni||{},PM=(T.state&&T.state.stats)||{},S=T.sht||{},L=T.lab||{},P=T.prog||{},PP=T.paper||{},OX=T.okx||{},CB=T.clob||{},EV=T.evolve||{};
  var H=(U.health&&U.health.modules)||{};
  var h='';
  if(tab==='ov'){
    h+='<div class="kpis">'
    +kpi('Polymarket Paper','$'+(PM.equity!=null?PM.equity.toFixed(2):'—'),pct(PM.pnl_pct||0)+'  '+(PM.trades||0)+' сделок  live котировки','grad '+cls(PM.pnl_pct))
    +kpi('OKX Paper (live свечи)','$'+(OX.equity!=null?OX.equity.toFixed(2):'—'),pct(OX.pnl_pct||0)+'  EMA '+((OX.params&&OX.params.ema_fast)||9)+'/'+((OX.params&&OX.params.ema_slow)||21),'grad '+cls(OX.pnl_pct))
    +kpi('Scalp Paper (бэктест-топ)','$'+(PP.stats&&PP.stats.equity!=null?PP.stats.equity.toFixed(2):'—'),(PP.stats?pct(PP.stats.pnl_pct||0):'—')+'  '+(PP.stats?PP.stats.n_trades||0:0)+' сделок',cls(PP.stats&&PP.stats.pnl_pct))
    +kpi('Бэктест-очередь',(P.done||0)+' / '+(P.total||0),P.pending>0?('в работе: '+(P.pending||0)):'очередь пуста','grad')
    +kpi('Golden-паттерны',(EV.golden||[]).length,'подтверждены IS+OOS на обеих площадках','gold')
    +kpi('Размечено окон',((L.data&&L.data.settled)||0),'Polymarket лаборатория  8 гипотез','grad')
    +'</div>';
    var mods=[['pm-worker','Polymarket сканер + paper-трейдинг','живые окна BTC/ETH/SOL каждые 5 мин',H.pm_worker,U.pm],
    ['pm-lab','Исследовательская лаборатория','гипотезы IS/OOS, калибровка',H.pm_lab,U.pm_lab],
    ['bt-worker','Walk-forward бэктесты','30+ стратегий  20 пар  4 ТФ',H.scalp_worker,U.scalp],
    ['okx-trader','Торговый движок OKX','paper на живых свечах  LIVE при ключах',H.okx_trader,OX],
    ['pm-trader','Polymarket CLOB-трейдер','реальные ордера при POLY_PRIVATE_KEY',H.pm_trader,CB],
    ['evolve','Эволюционное ядро','ML-оптимизация параметров
 каждый час','ok',EV]];
    h+='<div class="panel"><h3><span class="ic"></span>Модули экосистемы</h3><div class="modules">';
    mods.forEach(function(m){h+='<div class="mod"><div class="top"><div class="nm">'+m[0]+'</div>'+hbadge(m[3])+'</div><div class="ds">'+m[1]+'</div><div class="mt">'+m[2]+'  '+ago(m[4]&&m[4].age_s)+'</div></div>'});
    h+='</div></div>';
    h+='<div class="panel"><h3><span class="ic"></span>Как работает автономность</h3><table><tr><th>Петля</th><th>Что происходит без человека</th></tr>'
    +'<tr><td>Сбор</td><td>pm-worker и okx-trader каждые 5–10 мин тянут живые котировки Polymarket и OKX</td></tr>'
    +'<tr><td>Проверка</td><td>bt-worker прогоняет 30+ стратегий walk-forward (без подгонки: комиссия, split IS/OOS)</td></tr>'
    +'<tr><td>Эволюция</td><td>evolve каждый час ищет лучшие параметры на живых свечах OKX и обновляет best_params.json — трейдер подхватывает их сам</td></tr>'
    +'<tr><td>Golden</td><td>лаборатория Polymarket подтверждает закономерности IS+OOS — они попадают в общий журнал эволюции</td></tr>'
    +'<tr><td>Торговля</td><td>бумажные сделки по живым сигналам; при добавлении Secrets те же движки торгуют по-настоящему</td></tr></table></div>';
  }
  if(tab==='live'){
    var liveMode=OX.mode==='live';
    h+='<div class="kpis">'
    +kpi('Режим OKX',liveMode?'LIVE':'PAPER',liveMode?(OX.demo?'демо-счт OKX':'БОЕВОЙ счт!'):'живые свечи OKX 15m  без Secrets',liveMode?'grad':'')
    +kpi('Equity','$'+(OX.equity!=null?OX.equity.toFixed(2):'—'),pct(OX.pnl_pct||0)+' от $1000','grad '+cls(OX.pnl_pct))
    +kpi('Открытых позиций',OX.open||0,'лимит: 2  по сигналу EMAATR')
    +kpi('Сделок',OX.trades||0,'параметры: '+(OX.params_source==='evolve'?'от evolve-ядра ':'базовые'))
    +kpi('Polymarket CLOB',CB.mode==='live'?'LIVE':'OFF',esc((CB.note||'нет POLY_PRIVATE_KEY — paper остатся в pm-worker').slice(0,44)),CB.mode==='live'?'grad':'')
    +'</div>';
    h+='<div class="panel"><h3><span class="ic"></span>Кривая paper-eq
uity OKX (по сделкам)</h3>';
    var tr=(OX.paper&&OX.paper.trades)||[];
    h+=sparkline(tr.map(function(t){return t.pnl}).reverse());
    h+='<div class="dim" style="font-size:11px;margin-top:2px">'+(tr.length?'последних сделок: '+Math.min(tr.length,30):'первая сделка появится при пересечении EMA')+'</div></div>';
    h+='<div class="panel"><h3><span class="ic"></span>Сигналы движка (закрытые бары 15m, живые котировки OKX)</h3>';
    var sg=Object.keys(OX.signals||{}).map(function(k){var s=OX.signals[k];return [esc(k),(s.sig>0?'<span class="pos"> LONG</span>':(s.sig<0?'<span class="neg"> SHORT</span>':'<span class="dim">— ждм</span>')),(s.price!=null?('$'+s.price):'—'),s.err?'<span class="neg">'+esc(s.err.slice(0,44))+'</span>':'<span class="pos">API ok</span>']});
    h+=table(['Инструмент','Сигнал','Цена','OKX API'],sg);
    var pp=OX.paper_positions||{},lp=OX.live_positions||{};
    var rows=Object.keys(pp).map(function(k){var p=pp[k];return [esc(k),p.side>0?'<span class="pos">LONG</span>':'<span class="neg">SHORT</span>','$'+p.entry.toFixed(2),'$'+p.tp.toFixed(2),'$'+p.sl.toFixed(2),dt(p.opened),'<span class="badge b-acc">paper</span>']})
    .concat(Object.keys(lp).map(function(k){var p=lp[k];return [esc(k),p.side>0?'<span class="pos">LONG</span>':'<span class="neg">SHORT</span>','$'+p.entry,'$'+(p.tp||'—'),'$'+(p.sl||'—'),dt(p.opened),'<span class="badge b-live">LIVE</span>']}))
    h+='</div><div class="panel"><h3><span class="ic"></span>Позиции OKX</h3>'+table(['Инструмент','Направление','Вход','TP','SL','Открыто','Режим'],rows)+'</div>';
    var lg=(OX.paper&&OX.paper.trades||[]);
    h+='<div class="panel"><h3><span class="ic"></span>Журнал сделок (paper)</h3>'+table(['Время','Инструмент','Направление','Вход','Выход','PnL','$ эквити','Причина'],
    lg.slice(0,20).map(function(t){return [dt(t.ts),esc(t.inst),t.side==='long'?'<span class="pos">LONG</span>':'<span class="neg">SHORT</span>','$'+t.entry,'$'+t.exit,'<span class="'+cls(t.pnl)+'">'+(t.pnl
>=0?'+':'')+t.pnl.toFixed(3)+'</span>','',''+t.reason]}))+'</div>';
    h+='<div class="panel"><h3><span class="ic"></span>Polymarket CLOB — последний прогон</h3>'+table(['Параметр','Значение'],[
    ['Режим','<span class="badge '+(CB.mode==='live'?'b-live':'b-acc')+'">'+(CB.mode==='live'?'LIVE':'OFF')+'</span>'],
    ['Сигнал',CB.picked?esc(CB.picked.question||CB.picked.slug):'—'],
    ['Edge',CB.picked?CB.picked.edge:'—'],
    ['Ордер',CB.order?esc(JSON.stringify(CB.order).slice(0,90)):'—'],
    ['Ошибка',CB.error?'<span class="neg">'+esc(CB.error.slice(0,70))+'</span>':'нет'],
    ['Обновлено',dt(CB.updated)]])+'</div>';
  }
  if(tab==='pm'){
    h+='<div class="kpis">'
    +kpi('PM Paper Equity','$'+(PM.equity!=null?PM.equity.toFixed(2):'—'),pct(PM.pnl_pct||0),'grad '+cls(PM.pnl_pct))
    +kpi('Winrate',(PM.winrate||0)+'%',(PM.trades||0)+' закрытых окон')
    +kpi('Открытых',PM.open||0,'живых окон: '+(PM.sht_open||0))
    +kpi('Оконные сделки',PM.sht_trades||0,'PnL $'+(PM.sht_pnl||0),cls(PM.sht_pnl))
    +kpi('Калибровка',S.cal&&S.cal.brier!=null?'Brier '+S.cal.brier:'—','n='+(S.cal?S.cal.n:0)+'  точность '+(S.cal?S.cal.acc:'—'))
    +'</div>';
    var live=(S.live||[]).map(function(w){return [esc(w.title),esc(w.series),w.p_up!=null?w.p_up.toFixed(3):'—',w.fair_up!=null?w.fair_up:'—','<span class="'+cls(w.edge_up)+'">'+(w.edge_up!=null?w.edge_up:'—')+'</span>',Math.max(0,Math.round((w.end-Date.now()/1000)/60))+' мин']});
    h+='<div class="panel"><h3><span class="ic"></span>Живые бинарные окна (live котировки Polymarket)</h3>'+table(['Окно','Серия','Цена Up','Fair','Эдж','Осталось'],live)+'</div>';
    var st=(S.settled||[]).map(function(c){return [esc(c.question),esc(c.outcome),c.entry+'  '+c.exit,'<span class="'+cls(c.ret_pct)+'">'+pct(c.ret_pct)+'</span>',dt(c.closed),esc(c.reason||'')]});
    h+='<div class="panel"><h3><span class="ic"></span>Расчты по закрытым окнам</h3>'+table(['Окно','Исход','ВходВыход','PnL','Закрыто','Причина'],st)+'</div>';
   
 var sig=(T.signals&&T.signals.signals||[]).slice(0,12).map(function(s){return ['<span class="badge b-acc">'+esc(s.strategy)+'</span>',esc(s.question).slice(0,72),esc(s.outcome),s.price,'<span class="'+cls(s.edge)+'">'+(s.edge||0)+'</span>','$'+(s.liq||0)]});
    h+='<div class="panel"><h3><span class="ic"></span>Сигналы по классическим рынкам</h3>'+table(['Стратегия','Рынок','Исход','Цена','Эдж','Ликвидность'],sig)+'</div>';
  }
  if(tab==='bt'){
    h+='<div class="kpis">'
    +kpi('Прогресс волн',(P.done||0)+' / '+(P.total||0),'в очереди: '+(P.pending||0)+'  ошибок: '+(P.errors||0),'grad')
    +kpi('Scalp Paper','$'+(PP.stats&&PP.stats.equity!=null?PP.stats.equity.toFixed(2):'—'),PP.stats?pct(PP.stats.pnl_pct||0):'—',cls(PP.stats&&PP.stats.pnl_pct))
    +kpi('Paper-сделок',PP.stats?PP.stats.n_trades||0:0,'winrate '+(PP.stats?PP.stats.winrate||0:0)+'%')
    +kpi('Стратегий в топе',PP.tops?PP.tops.length:0,'торгуют виртуально')
    +'</div>';
    var lb=(U.scalp&&U.scalp.leaderboard)||[];
    h+='<div class="panel"><h3><span class="ic"></span>Лидерборд walk-forward (OOS, с комиссиями и слиппеджем)</h3>'
    +table(['#','Стратегия','Пара','ТФ','Sharpe','PF','t-стат','Сделок','В месяц','Режим'],
    lb.map(function(r,i){return [i+1,'<b>'+esc(r.strategy)+'</b>',esc(r.symbol),esc(r.tf),r.oos_sharpe,r.oos_pf,r.oos_t,r.trades,r.monthly_pct!=null?pct((parseFloat(r.monthly_pct)*100).toFixed(2)):'—',esc(r.fee_mode)]}));
    h+='</div><div class="panel"><h3><span class="ic"></span>Позиции scalp paper-трейдинга</h3>'
    +table(['Стратегия','Направление','Вход','Открыто','Режим'],Object.keys(PP.positions||{}).map(function(k){var p=PP.positions[k];return ['<b>'+esc(k)+'</b>',p.signal>0?'<span class="pos">LONG</span>':'<span class="neg">SHORT</span>',p.entry,dt(p.opened),esc(p.fee_mode)]}))+'</div>';
  }
  if(tab==='ev'){
    var b=EV.best_okx||{};
    h+='<div class="kpis">'
    +kpi('Поколение параметров',EV.history?EV.history.length:0,'каждый час — walk-forward на живых 
свечах','grad')
    +kpi('Лучшие параметры (OKX)','EMA '+b.ema_fast+'/'+b.ema_slow,'SL '+b.sl_atr+'ATR  TP '+b.tp_atr+'ATR','gold')
    +kpi('OOS-доходность лучшей',b.oos_ret!=null?pct(b.oos_ret):'—','out-of-sample, с комиссией roundtrip',cls(b.oos_ret))
    +kpi('Golden-паттерны',(EV.golden||[]).length,'IS + OOS на обеих площадках','gold')
    +kpi('Кандидатов найдено',(EV.candidates||[]).length,'прошли фильтр IS+OOS')
    +'</div>';
    var g=EV.golden||[];
    h+='<div class="panel"><h3><span class="ic"></span>Golden-паттерны (подтверждены без подгонки)</h3><div class="gbar">';
    g.forEach(function(x){h+='<div class="gcard"><div class="s">'+esc(x.src)+'</div><div class="n">'+esc(x.name)+'</div><div class="d">'+esc((x.note||'').slice(0,90))+'</div></div>'});
    if(!g.length)h+='<div class="empty">Система ещ копит данные: паттерн попадает сюда только после подтверждения IS и OOS</div>';
    h+='</div></div>';
    h+='<div class="panel"><h3><span class="ic"></span>Кандидаты эволюции (OKX, живые свечи 15m)</h3>'
    +table(['EMA','SLATR','TPATR','IS %','OOS %','Сделок'],
    (EV.candidates||[]).map(function(c){return [c.ema_fast+'/'+c.ema_slow,c.sl_atr,c.tp_atr,'<span class="'+cls(c.is_ret)+'">'+c.is_ret+'</span>','<span class="'+cls(c.oos_ret)+'">'+c.oos_ret+'</span>',c.trades]}))+'</div>';
    h+='<div class="panel"><h3><span class="ic"></span>История поколений</h3>'
    +table(['Время','Лучшие параметры','Golden','Статус'],
    (EV.history||[]).slice(0,15).map(function(x){var b=x.best||{};return [dt(x.ts),b.ema_fast?('EMA '+b.ema_fast+'/'+b.ema_slow+'  OOS '+b.oos_ret+'%'):'—',x.golden_n||0,x.err?'<span class="neg">'+esc(x.err.slice(0,40))+'</span>':'<span class="pos">ok</span>']}))+'</div>';
  }
  if(tab==='rs'){
    h+='<div class="kpis">'
    +kpi('Статус',L.status==='ready'?'ГОТОВА':'СБОР',esc((L.status_note||'').slice(0,40)),L.status==='ready'?'grad':'')
    +kpi('Размечено окон',((L.data&&L.data.settled)||0),'цель ~200 окон')
    +kpi('Снимков',
((L.data&&L.data.snaps)||0),'охват '+(L.data?L.data.span_h:0)+' ч')
    +kpi('Golden',((L.golden||[]).length),'IS+OOS подтверждены','gold')
    +'</div>';
    var hy=(L.hyp||[]).map(function(x){return ['<b>'+esc(x.name)+'</b>','<span class="badge '+(String(x.status).indexOf('')>=0?'b-ok':(String(x.status).indexOf('')>=0?'b-gold':'b-warn'))+'">'+esc(x.status)+'</span>','IS: '+esc(x.is_v)+' (n='+(x.is_n||0)+')','OOS: '+esc(x.oos_v)+' (n='+(x.oos_n||0)+')','<span class="dim">'+esc((x.note||'').slice(0,50))+'</span>']});
    h+='<div class="panel"><h3><span class="ic"></span>Гипотезы (пороги зафиксированы до теста — против подгонки)</h3>'+table(['Гипотеза','Вердикт','IS','OOS','Заметка'],hy)+'</div>';
    h+='<div class="panel"><h3><span class="ic"></span>Golden лаборатории</h3><div class="gbar">';
    (L.golden||[]).forEach(function(x){h+='<div class="gcard"><div class="s">polymarket</div><div class="n">'+esc(x.name)+'</div><div class="d">'+esc((x.note||'').slice(0,90))+'</div></div>'});
    if(!(L.golden||[]).length)h+='<div class="empty">Ни одна гипотеза ещ не подтверждена OOS — система честно ждт данных</div>';
    h+='</div></div>';
  }
  document.getElementById('app').innerHTML=h;
}
function load(){
  Promise.all([get('results/universe.json'),get('results/state.json'),get('results/sht.json'),get('results/lab.json'),
  get('engines/scalp/results/progress.json'),get('engines/scalp/results/paper.json'),get('results/signals.json'),
  get('engines/okx/results/okx_live.json'),get('results/clob.json'),get('results/evolve.json')])
  .then(function(r){T.uni=r[0];T.state=r[1];T.sht=r[2];T.lab=r[3];T.prog=r[4];T.paper=r[5];T.signals=r[6];T.okx=r[7];T.clob=r[8];T.evolve=r[9];
  header(T.uni||{});render();});
}
document.getElementById('tabs').addEventListener('click',function(e){
if(e.target.tagName!=='BUTTON')return;
document.querySelectorAll('#tabs button').forEach(function(b){b.classList.remove('on')});
e.target.classList.add('on');render();});
load();setInterval(load
,60000);
</script>
</body>
